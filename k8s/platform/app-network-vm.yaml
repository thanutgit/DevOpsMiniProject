# การ expose แอปบน VM — ดูแลโดย platform (Ansible) เพื่อให้ CI ไม่มีสิทธิ์แตะ routing
# HTTP อย่างเดียว (Let's Encrypt เข้ามาตรวจ IP ภายในบ้านไม่ได้)
apiVersion : v1
kind: Service
metadata:
  name: app-service
  namespace: devops-project
spec:
  selector:
    app: devops-project
  ports:
    - port: 3020
      targetPort: 3010
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: devops-project
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 3020