grafana:
  env:
    GF_SERVER_ROOT_URL: https://45.150.128.180.nip.io/grafana
    GF_SERVER_SERVE_FROM_SUB_PATH: true

alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [alertname, exported_namespace, name]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: discord
          matchers:
            - alertname =~ "Certificate.*"
    # receivers อยู่ใน alertmanager-discord-values.yaml (มี webhook URL ห้าม commit)
