# ตัวตนของ CI (GitHub Actions runner) — สิทธิ์เฉพาะที่ job deploy ใช้จริง ใน namespace นี้เท่านั้น
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: devops-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: devops-project
rules:
  # secret ของแอป: สร้างได้ แต่อ่าน/แก้ได้เฉพาะตัวนี้ (อ่าน TLS key หรือ token อื่นไม่ได้)
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [devops-project-secret]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, create, update, patch]
  # อ่าน pod/log ไว้ debug เวลา deploy fail
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]   # patch = rollout restart
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]                          # rollout status
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]  # delete + wait
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, update, patch]
  - apiGroups: [traefik.io]
    resources: [middlewares]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: devops-project
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: devops-project
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
---
# token ถาวรของ SA (Kubernetes เติม data.token ให้เอง) — ใช้สร้าง kubeconfig ให้ runner
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: devops-project
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token