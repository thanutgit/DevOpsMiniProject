# การ expose แอปบน prd — ดูแลโดย platform (Ansible) เพื่อให้ CI ไม่มีสิทธิ์แตะ routing
# (Ingress ใช้ Traefik ร่วมกันทั้ง cluster → ถ้า CI สร้าง Ingress ได้ จะดัก path ของ namespace อื่นได้)
# HTTPS ด้วย cert-manager + Let's Encrypt และ redirect HTTP → HTTPS
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: devops-project
spec:
  selector:
    app: devops-project
  ports:
    - port: 3020
      targetPort: 3010
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: devops-project
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: devops-project
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: devops-project-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 45.150.128.180.nip.io
      secretName: app-tls
  rules:
    - host: 45.150.128.180.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 3020