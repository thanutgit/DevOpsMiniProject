# Dev (VirtualBox, IP ภายใน) — HTTP อย่างเดียว
# Let's Encrypt ยิงเข้ามาตรวจ IP ภายในบ้านไม่ได้ จึงไม่ทำ TLS บน dev
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: devops-project
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 3020