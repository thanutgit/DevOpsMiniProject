name: Promote Image

# นำ image ที่ผ่านการทดสอบบน dev แล้ว ไปใช้ที่ prd โดยไม่ build ใหม่
# ผลคือ image บน prd เป็นตัวเดียวกับที่ทดสอบ (digest ตรงกันทุก byte)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag ที่ผ่านการทดสอบบน dev แล้ว (e.g. v2026.09.25)'
        required: true

permissions:
  contents: read
  packages: write

env:
  DEV_IMAGE: ghcr.io/thanutgit/devopsminiproject-dev
  PRD_IMAGE: ghcr.io/thanutgit/devopsminiproject-prd
  # ส่ง input ผ่าน env แทนการแทรก ${{ }} ลงใน script ตรง ๆ (กัน script injection)
  TAG: ${{ inputs.tag }}

jobs:
  promote:
    # promote ได้จาก main เท่านั้น = ต้องผ่าน PR + CI มาแล้ว
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     

      # ต้องมี image บน dev (กันพิมพ์ tag ผิด)
      - name: Check dev image exists
        run: docker buildx imagetools inspect "$DEV_IMAGE:$TAG"

      # โค้ดใน image ต้องผ่าน PR เข้า main แล้ว
      - name: Image must come from a commit on main
        run: |
          SHA=$(docker buildx imagetools inspect "$DEV_IMAGE:$TAG" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')
          if [ -z "$SHA" ] || [ "$SHA" = "<no value>" ]; then
            echo "::error::image has no revision label (built before labels were added?) — rebuild it"
            exit 1
          fi
          echo "image built from: $SHA"
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::commit $SHA is not on main"; exit 1; }

      # ห้ามเขียนทับ tag ที่มีอยู่บน prd แล้ว (tag ต้องไม่เปลี่ยนความหมาย)
      - name: Refuse to overwrite prd tag
        run: |
          if docker buildx imagetools inspect "$PRD_IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$PRD_IMAGE:$TAG already exists"
            exit 1
          fi

      # copy manifest ไปอีก repo โดยไม่ build ใหม่
      # --prefer-index=false = copy ตรงตัว (carbon copy) ไม่ห่อเป็น index ใหม่ → digest เท่าเดิม
      - name: Promote dev to prd
        run: |
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$PRD_IMAGE:$TAG" \
            "$DEV_IMAGE:$TAG"

      # พิสูจน์ว่าเป็น image ตัวเดียวกันจริง
      - name: Verify digests match
        run: |
          DEV=$(docker buildx imagetools inspect "$DEV_IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          PRD=$(docker buildx imagetools inspect "$PRD_IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          echo "dev: $DEV"
          echo "prd: $PRD"
          [ "$DEV" = "$PRD" ]