name: CI
on:
  pull_request:
    branches: [main, dev]   
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true       

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet # ตรวจบั๊กที่ compiler ไม่จับ เช่น Printf("%d", "string") ผิด format, ลืม defer cancel() หลัง WithTimeout (./... = ทุก package ในโปรเจกต์)
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -cover # -reace เปิดตัวตรวจ race condition (เช่น ถ้ามีคนเปลี่ยน atomic กลับเป็น ++), -cover: แสดง % ของโค้ดที่ test ไปถึง ดูได้ใน log
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs #สแกนไฟล์ในโฟลเดอร์ (ไม่ใช่ image)
          scan-ref: . #โฟลเดอร์ไหน: ทั้ง repo
          scanners: vuln,secret,misconfig #vuln = ช่องโหว่ใน library (go.mod), secret = รหัสผ่าน/token ที่เผลอ commit, misconfig = ตั้งค่าไม่ปลอดภัยใน Dockerfile/k8s yaml
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build image
        run: docker build -t devopsminiproject:ci .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devopsminiproject:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          skip-setup-trivy: true 