---
  - name: Set Hostname
    ansible.builtin.hostname:
      name: "{{ inventory_hostname }}"
  - name: Update /etc/hosts
    ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: '^127\.0\.1\.1'
      line: "127.0.1.1 {{ inventory_hostname }}"
  - name: Disable cloud-init network config
    ansible.builtin.copy:
      dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
      content: |
        network: {config: disabled}
      mode: '0644'
  - name: Disable cloud-init (Ansible manages this host from now on)
    ansible.builtin.copy:
      dest: /etc/cloud/cloud-init.disabled
      content: ""
      mode: '0644'
  - name: Delete Search Domain from netplan
    ansible.builtin.lineinfile:
      path: /etc/netplan/50-cloud-init.yaml
      regexp: '^\s*search:'
      state: absent 
    notify: Apply netplan
  - name: Configure firewall (ufw)
    when: manage_ufw | bool
    block:
      - name: Allow SSH
        community.general.ufw:
          rule: allow
          name: OpenSSH
      - name: Deny incoming by default
        community.general.ufw:
          default: deny
          direction: incoming
      - name: Allow HTTP/HTTPS form anywhere
        community.general.ufw:
          rule: allow
          port: "{{ item }}"
          proto: tcp
        loop: ['80','443']
      - name: Allow all traffic between cluster nodes
        community.general.ufw:
          rule: allow
          from_ip: "{{ item }}"
        loop: "{{ groups['k3s'] | map('extract', hostvars, 'ansible_host') | list }}"
      - name: Allow pod and service subnets
        community.general.ufw:
          rule: allow
          from_ip: "{{ item }}"
        loop:
          - 10.42.0.0/16
          - 10.43.0.0/16
      - name: Enable UFW
        community.general.ufw:
          state: enabled