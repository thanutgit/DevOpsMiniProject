helm_version: v3.21.1
helm_arch: amd64
kubeconfig_path: /etc/rancher/k3s/k3s.yaml
helm_diff_version: v3.15.15

# ไฟล์ values/manifest อ่านจาก repo บนเครื่อง controller (WSL)
platform_dir: "{{ playbook_dir }}/../k8s/platform"

cert_manager_chart_version: v1.21.2
kube_prometheus_stack_chart_version: 86.2.3

install_cert_manager: false     # เปิดเฉพาะ prd ใน inventory

# โครงของ receivers อยู่ใน git ส่วน URL จริงมาจาก secrets/<env>.yaml (Vault)
alertmanager_receivers:
  alertmanager:
    config:
      receivers:
        - name: "null"
        - name: discord
          discord_configs:
            - webhook_url: "{{ discord_webhook_url }}"
              send_resolved: true

grafana_secret_values:
  grafana:
    adminPassword: "{{ grafana_admin_password }}"